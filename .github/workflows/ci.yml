name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and validation extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,docs,dashboard,notebooks,waveforms]"

      - name: Check validation environment
        run: |
          python tools/check_validation_environment.py --groups release

      - name: Preflight tutorial notebook sources
        run: |
          MPLCONFIGDIR=/tmp/mplconfig_svtk python tools/execute_tutorial_notebooks.py --preflight-only --include-large-run

      - name: Check patch whitespace
        run: |
          git diff --check

      - name: Run tests
        run: |
          MPLCONFIGDIR=/tmp/mplconfig_svtk python -m pytest -q

      - name: Compile source and tests
        run: |
          PYTHONPYCACHEPREFIX=/tmp/svtk_pycache python -m compileall -q src tests tools

      - name: Check generated CLI reference
        run: |
          PYTHONPATH=src python tools/generate_cli_reference.py --check

      - name: Import every public module
        run: |
          MPLCONFIGDIR=/tmp/mplconfig_svtk python - <<'PY'
          import importlib
          import pathlib
          import sys
          root = pathlib.Path("src/spatial_vtk")
          paths = sorted(root.rglob("*.py"))
          failures = []
          for path in paths:
              if path.name == "__main__.py":
                  continue
              module = ".".join(path.with_suffix("").parts[1:])
              if module.endswith(".__init__"):
                  module = module[:-9]
              try:
                  importlib.import_module(module)
              except Exception as exc:
                  failures.append((module, type(exc).__name__, str(exc)))
          print(f"imported={len(paths) - 1 - len(failures)} failed={len(failures)}")
          for failure in failures:
              print(failure)
          if failures:
              sys.exit(1)
          PY

      - name: CLI smoke tests
        run: |
          svtk --help
          svtk --version
          svtk plot metrics list
          svtk map spatial list
          svtk visualize context list

  docs-and-build:
    name: Docs and package build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[validation,docs,dashboard,notebooks,waveforms]"

      - name: Check validation environment
        run: |
          python tools/check_validation_environment.py --groups release

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Check generated CLI reference
        run: |
          PYTHONPATH=src python tools/generate_cli_reference.py --check

      - name: Build docs with warnings as errors
        run: |
          MPLCONFIGDIR=/tmp/mplconfig_svtk python -m sphinx -W -b html docs docs/_build/html

      - name: Execute tutorial notebooks
        run: |
          MPLCONFIGDIR=/tmp/mplconfig_svtk python tools/execute_tutorial_notebooks.py --clean --include-large-run

      - name: Build source distribution and wheel
        run: |
          python -m build --sdist --wheel

      - name: Check package metadata
        run: |
          python -m twine check dist/*

      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zipfile
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel was built.")
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          required = ["spatial_vtk/config/default_outputs.yaml"]
          for name in required:
              if name not in names:
                  raise SystemExit(f"Wheel is missing required file: {name}")
          forbidden_prefixes = ("data/", "docs/", "tests/", "tools/", "outputs/")
          if any(name.startswith(forbidden_prefixes) for name in names):
              raise SystemExit("Wheel contains repository-only content.")
          if any("__pycache__" in name or name.endswith((".pyc", ".DS_Store", ".ipynb")) for name in names):
              raise SystemExit("Wheel contains generated files or notebooks.")
          if not any(name.startswith("spatial_vtk/") for name in names):
              raise SystemExit("Wheel does not contain spatial_vtk.")
          print(f"checked {wheels[0].name}: {len(names)} files")
          PY
